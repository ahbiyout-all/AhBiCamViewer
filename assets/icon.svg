<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#091e42"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base rounded square -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" filter="url(#shadow)"/>

  <!-- Glow halo -->
  <circle cx="256" cy="220" r="140" fill="url(#accentGrad)" opacity="0.15" filter="blur(20px)"/>

  <!-- Stand / Arm of Visualizer -->
  <path d="M 120 420 L 392 420" stroke="#475569" stroke-width="20" stroke-linecap="round"/>
  <rect x="180" y="405" width="152" height="15" rx="7" fill="url(#accentGrad)"/>
  <path d="M 256 405 L 256 310" stroke="#64748b" stroke-width="18" stroke-linecap="round"/>
  
  <!-- Curved gooseneck arm -->
  <path d="M 256 310 C 256 260, 360 250, 360 180 C 360 140, 320 110, 270 110" fill="none" stroke="#94a3b8" stroke-width="16" stroke-linecap="round"/>
  
  <!-- Camera Head Body -->
  <rect x="160" y="140" width="192" height="150" rx="36" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="8" filter="url(#shadow)"/>

  <!-- Lens Outer Ring -->
  <circle cx="256" cy="215" r="54" fill="#0f172a" stroke="#60a5fa" stroke-width="6"/>

  <!-- Glass Lens -->
  <circle cx="256" cy="215" r="42" fill="url(#lensGrad)"/>

  <!-- Lens reflection -->
  <ellipse cx="244" cy="202" rx="16" ry="10" fill="#ffffff" opacity="0.6" transform="rotate(-30 244 202)"/>
  <circle cx="270" cy="228" r="6" fill="#ffffff" opacity="0.4"/>

  <!-- Camera Status LED -->
  <circle cx="324" cy="168" r="7" fill="#ef4444"/>
  <circle cx="324" cy="168" r="12" fill="#ef4444" opacity="0.4"/>

  <!-- Classroom Pen / Ruler Badge -->
  <g transform="translate(330, 320)">
    <circle cx="45" cy="45" r="45" fill="url(#accentGrad)" filter="url(#shadow)"/>
    <path d="M 28 62 L 62 28 L 56 22 L 22 56 Z" fill="#ffffff"/>
    <polygon points="22,56 20,64 28,62" fill="#facc15"/>
  </g>
</svg>
