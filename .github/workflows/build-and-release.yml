name: Build and Release AhBiCamViewer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Native DLLs, Setup Installer and Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------
      # Node.js Runtime Specification
      # NOTE: Node.js 20 has reached End-of-Life (EOL 2026-04).
      # Modern GitHub Actions runners strictly require Node.js 22 LTS or Node.js 24.
      # ----------------------------------------------------
      - name: Setup Modern Node.js 22 LTS Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true

      - name: Extract Semantic Version from version.json
        id: get_version
        shell: pwsh
        run: |
          $verJson = Get-Content -Raw "version.json" | ConvertFrom-Json
          $version = $verJson.version
          Write-Host "Detected Semantic Version: v$version"
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET Framework Tools (csc & ilasm)
        shell: pwsh
        run: |
          $frameworkPath = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319"
          if (!(Test-Path $frameworkPath)) {
            $frameworkPath = "C:\Windows\Microsoft.NET\Framework\v4.0.30319"
          }
          Write-Host "Using .NET Framework Path: $frameworkPath"
          echo "$frameworkPath" >> $env:GITHUB_PATH

      - name: Compile Native Core DLLs and Run Verification Tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "bin" -Force | Out-Null
          
          Write-Host "[1/3] Compiling Managed Core: bin/ClassroomVisualizerManaged.dll..."
          csc /target:library /platform:x86 /out:bin\ClassroomVisualizerManaged.dll /optimize+ src\dll\LicenseCore.cs src\dll\NativeSystemCore.cs
          if ($LASTEXITCODE -ne 0) { throw "Managed DLL compilation failed" }

          Write-Host "[2/3] Assembling Native Export DLL: bin/ClassroomVisualizerCore.dll..."
          ilasm /dll /quiet /out=bin\ClassroomVisualizerCore.dll src\dll\ClassroomVisualizerCore.il
          if ($LASTEXITCODE -ne 0) { throw "ILASM assembly failed" }

          Write-Host "[3/3] Compiling & Running TestRunner.exe..."
          csc /target:exe /platform:x86 /out:bin\TestRunner.exe src\dll\TestRunner.cs
          if ($LASTEXITCODE -ne 0) { throw "TestRunner compilation failed" }

          & "bin\TestRunner.exe"
          if ($LASTEXITCODE -ne 0) { throw "Native DLL verification tests failed" }
          Write-Host "[SUCCESS] All native verification tests passed!"

      - name: Install Inno Setup Compiler
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          Write-Host "Inno Setup installation completed."

      - name: Build Inno Setup Installer (Windows Executable)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          Write-Host "Using ISCC: $iscc"
          & $iscc /DMyAppVersion="$($env:APP_VERSION)" "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          
          Write-Host "[SUCCESS] Installer generated:"
          Get-ChildItem "dist"

      - name: Generate Release Notes
        id: release_notes
        shell: pwsh
        run: |
          $notesPath = "docs/PATCHNOTES.md"
          $body = ""
          if (Test-Path $notesPath) {
            $content = Get-Content -Raw $notesPath
            $match = [regex]::Match($content, "(## v$($env:APP_VERSION).*?)(?=## v|\Z)", [System.Text.RegularExpressions.RegexOptions]::Singleline)
            if ($match.Success) {
              $body = $match.Groups[1].Value.Trim()
            } else {
              $body = "Release v$($env:APP_VERSION) of Classroom Visualizer."
            }
          } else {
            $body = "Release v$($env:APP_VERSION) of Classroom Visualizer."
          }
          $body += "`r`n`r`n---`r`n### 👤 제작자 및 공식 채널`r`n- 개발자: AhBiYout`r`n- GitHub: https://github.com/AhBiYout-all`r`n- 저장소: https://github.com/AhBiYout-all/AhBiCamViewer`r`n- 공식 블로그: https://ahbiyoutvibe.blogspot.com/`r`n- 공식 소속: https://www.cisnet.co.kr"
          [System.IO.File]::WriteAllText("release_body.md", $body, [System.Text.Encoding]::UTF8)

      - name: Publish GitHub Release (Installer Only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: 아비캠뷰어 (AhBiCamViewer) v${{ env.APP_VERSION }}
          body_path: release_body.md
          draft: false
          prerelease: false
          files: |
            dist/*_Setup_v*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
